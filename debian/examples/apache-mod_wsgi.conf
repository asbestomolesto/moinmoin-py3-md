# Written by Claude (Anthropic AI) for Gabriele 'asbesto' Zaverio, 2026,
# as part of the Python 3 port of MoinMoin (version 1.10.0).
# MoinMoin with Apache 2.4 and mod_wsgi (package libapache2-mod-wsgi-py3)
#
#   moin-mkwiki -n "My Wiki" -s AdminUser /srv/moin/mywiki
#   cp /usr/share/doc/python3-moinmoin/examples/apache-mod_wsgi.conf \
#      /etc/apache2/sites-available/mywiki.conf     (and adapt it)
#   a2enmod wsgi; a2ensite mywiki; /etc/init.d/apache2 reload

<VirtualHost *:80>
    ServerName wiki.example.org

    # static files (theme, javascript): served by Apache, much faster
    Alias /moin_static1100 /usr/share/moin/htdocs
    <Directory /usr/share/moin/htdocs>
        Require all granted
    </Directory>

    # the wiki at the root url, e.g. http://wiki.example.org/FrontPage
    WSGIScriptAlias / /srv/moin/mywiki/moin.wsgi
    WSGIDaemonProcess mywiki user=www-data group=www-data processes=2 threads=10 maximum-requests=1000 umask=0007
    WSGIProcessGroup mywiki
    WSGIApplicationGroup %{GLOBAL}
    <Directory /srv/moin/mywiki>
        <Files moin.wsgi>
            Require all granted
        </Files>
    </Directory>
</VirtualHost>

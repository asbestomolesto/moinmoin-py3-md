# uWSGI (packages uwsgi and uwsgi-plugin-python3), e.g. as
# /etc/uwsgi/apps-available/mywiki.ini, enabled with a symlink in apps-enabled
# (the Debian/Devuan uwsgi package has a sysvinit script for /etc/uwsgi).
[uwsgi]
plugins = python3
chdir = /srv/moin/mywiki
wsgi-file = /srv/moin/mywiki/moin.wsgi
uid = www-data
gid = www-data
processes = 2
threads = 4
umask = 007
# for nginx (uwsgi_pass), see nginx-uwsgi.conf
socket = /run/uwsgi/app/mywiki/socket

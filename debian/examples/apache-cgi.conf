# MoinMoin as CGI (slow, but needs nothing else): Apache 2.4 with mod_cgi
#   a2enmod cgi
Alias /moin_static1911 /usr/share/moin/htdocs
<Directory /usr/share/moin/htdocs>
    Require all granted
</Directory>
ScriptAlias /mywiki /srv/moin/mywiki/moin.cgi
<Directory /srv/moin/mywiki>
    <Files moin.cgi>
        Require all granted
    </Files>
</Directory>

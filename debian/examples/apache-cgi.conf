# Written by Claude (Anthropic AI) for Gabriele 'asbesto' Zaverio, 2026,
# as part of the Python 3 port of MoinMoin (version 1.10.0).
# MoinMoin as CGI (slow, but needs nothing else): Apache 2.4 with mod_cgi
#   a2enmod cgi
Alias /moin_static1120 /usr/share/moin/htdocs
<Directory /usr/share/moin/htdocs>
    Require all granted
</Directory>
ScriptAlias /mywiki /srv/moin/mywiki/moin.cgi
<Directory /srv/moin/mywiki>
    <Files moin.cgi>
        Require all granted
    </Files>
</Directory>

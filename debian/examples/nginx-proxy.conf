# nginx as reverse proxy for the standalone server of MoinMoin
# (/etc/init.d/moinmoin, configured in /etc/default/moinmoin), or for
# gunicorn: gunicorn -b 127.0.0.1:8080 --chdir /srv/moin/mywiki moin_wsgi:application
server {
    listen 80;
    server_name wiki.example.org;

    location /moin_static1100/ {
        alias /usr/share/moin/htdocs/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
}

# Written by Claude (Anthropic AI) for Gabriele 'asbesto' Zaverio, 2026,
# as part of the Python 3 port of MoinMoin (version 1.10.0).
# lighttpd with FastCGI, e.g. /etc/lighttpd/conf-available/50-mywiki.conf
#   lighty-enable-mod fastcgi
server.modules += ( "mod_fastcgi", "mod_alias" )
alias.url += ( "/moin_static1120/" => "/usr/share/moin/htdocs/" )
fastcgi.server += ( "/mywiki" =>
    (( "bin-path" => "/srv/moin/mywiki/moin.fcgi",
       "socket" => "/run/lighttpd/mywiki.sock",
       "check-local" => "disable",
       "max-procs" => 1,
    ))
)

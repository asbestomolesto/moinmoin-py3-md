# nginx in front of uWSGI (see uwsgi-mywiki.ini),
# e.g. /etc/nginx/sites-available/mywiki
server {
    listen 80;
    server_name wiki.example.org;

    location /moin_static1911/ {
        alias /usr/share/moin/htdocs/;
        expires 30d;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/run/uwsgi/app/mywiki/socket;
        client_max_body_size 20m;   # attachment uploads
    }
}

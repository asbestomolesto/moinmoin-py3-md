# Written by Claude (Anthropic AI) for Gabriele 'asbesto' Zaverio, 2026,
# as part of the Python 3 port of MoinMoin (version 1.10.0).
# MoinMoin with Apache 2.4 and mod_fcgid (package libapache2-mod-fcgid)
#   a2enmod fcgid
Alias /moin_static1120 /usr/share/moin/htdocs
<Directory /usr/share/moin/htdocs>
    Require all granted
</Directory>
ScriptAlias /mywiki /srv/moin/mywiki/moin.fcgi
<Directory /srv/moin/mywiki>
    <Files moin.fcgi>
        SetHandler fcgid-script
        Options +ExecCGI
        Require all granted
    </Files>
</Directory>
